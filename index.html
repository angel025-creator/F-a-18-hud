<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighter HUDs (interactive)</title>
<style>
:root{--g:#39ff88;--dim:#1f7a44;--bg:#000;--panel:#0d0f0e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#d5e8db;font-family:system-ui,-apple-system,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:19px;margin:4px 0 10px;font-weight:600}
#planes{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.plane{flex:0 0 132px;scroll-snap-align:start;background:var(--panel);border:1px solid #23302a;border-radius:12px;padding:10px 8px;color:inherit;text-align:center;font:inherit;cursor:pointer}
.plane svg{width:64px;height:40px;fill:none;stroke:var(--dim);stroke-width:2}
.plane b{display:block;font-size:14px;margin-top:4px}
.plane small{color:#7d9186;font-size:12px}
.plane.on{border-color:var(--g)}
.plane.on svg{stroke:var(--g)}
.plane.soon{opacity:.55}
#hudbox{border:1px dashed #2a4a37;border-radius:14px;padding:6px;background:#050706}
svg.hud{display:block;width:100%;height:auto}
svg.hud *{stroke:var(--g);stroke-width:1.6;fill:none;stroke-linecap:round}
svg.hud text{fill:var(--g);stroke:none;font:12px ui-monospace,Menlo,Consolas,monospace}
svg.hud .f{fill:var(--g)}
svg.hud .hit{stroke:none;fill:transparent}
svg.hud .t.sel .hit{stroke:#fff;stroke-width:1.4;stroke-dasharray:4 3;fill:rgba(57,255,136,.14)}
.t{cursor:pointer}
.t.sel{filter:drop-shadow(0 0 5px #b8ffd3)}
#mode{display:block;width:100%;margin:12px 0;padding:12px;background:#151a17;border:1px solid #3a4a41;border-radius:12px;color:inherit;font:inherit;cursor:pointer;text-align:center}
#mode span{display:block;color:#8a9a90;font-size:12px}
#mode b{display:block;color:var(--g);font:600 22px ui-monospace,Menlo,monospace;margin:2px 0}
#card{background:#111;border:1px solid #2b2f2d;border-radius:12px;padding:14px 16px}
#card h2{margin:0 0 6px;font-size:18px}
#card p{margin:0;line-height:1.55;color:#b9c4bd}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Fighter HUDs</h1>
<div id="planes" role="tablist" aria-label="Aircraft"></div>
<div id="hudbox"><svg id="hud" class="hud" viewBox="0 0 400 420" role="img" aria-label="Head-up display"></svg></div>
<button id="mode" type="button"></button>
<div id="card" aria-live="polite"></div>
</main>
<script>
const T=(x,y,s,a)=>`<text x="${x}" y="${y}"${a?` text-anchor="${a}"`:''}>${s}</text>`;
const G=(k,c)=>`<g class="t" data-k="${k}">${c}</g>`;
const L=(a,b,c,d)=>`<path d="M${a} ${b}L${c} ${d}"/>`;
const jet='<svg viewBox="0 0 100 60"><path d="M50 4L56 22 92 40V46L58 40 56 54 64 58V60H36V58L44 54 42 40 8 46V40L44 22Z"/></svg>';

const INFO={
 hdg:['Heading tape','Your compass heading. Ticks mark 5° steps; the boxed number is your exact heading (360 = north).'],
 spd:['Airspeed','Calibrated airspeed in knots. The box shows the current value and the tape slides past it.'],
 alt:['Altitude','Height above sea level in feet. Watch this closely during low-level attack runs.'],
 ladder:['Pitch ladder','Lines every 5°/10° showing nose angle. Solid lines are above the horizon, dashed lines below. The long center line is the horizon.'],
 fpm:['Flight path marker','Shows where the aircraft is actually going, not where the nose points. Put it on a target or runway to fly there.'],
 aoa:['Angle of attack bracket','Height of the bracket shows how hard the wing is working. Centered means optimal; too high means close to a stall.'],
 mg:['Mach and G','Mach number (M.85 = 85% of the speed of sound) and current G load on the airframe.'],
 nav:['Navigation data','Active waypoint, distance to it in nautical miles, and time to go.'],
 store:['Weapon status','Selected weapon and how many are ready to use.'],
 rng:['Range','Distance to the target or radar range setting.'],
 gun:['Gun reticle','The circle with the dot is where cannon rounds will go. Put it on the target and fire.'],
 tgt:['Target box','A radar or sensor lock. The numbers show range (nm) and closure rate (kts). Positive means closing.'],
 cue:['Steering cue','Fly the flight path marker to this cue to line up on the target.'],
 pipper:['Bomb pipper','Where a bomb released right now would hit (CCIP). Steer it onto the target, then release.'],
 ccip:['Impact line','Dashed line linking your flight path marker to the predicted impact point.'],
 rel:['Release cue','The bar drops toward the pipper. Release when it reaches the pipper for a good solution.'],
 wp:['Waypoint marker','Shows where your current waypoint is. Turn until it sits on the flight path marker.'],
 wind:['Wind','Wind direction (degrees) and speed (knots).'],
 fuel:['Fuel and ETA','Fuel remaining in thousands of pounds and estimated time of arrival at the waypoint.'],
 ase:['ASE circle','Allowable Steering Error circle. Keep the dot inside it for the best missile shot.'],
 td:['Target designator box','Box on the radar-locked target. Its size and numbers show range and closing speed.'],
 rbar:['Range scale','Vertical bar with Rmax and Rmin ticks. The caret shows target range. Shoot while it is between them.'],
 scan:['Missile scan circle','The infrared missile seeker looks inside this circle. Put the target in it to get a tone.'],
 ils:['ILS steering lines','Vertical line = runway centerline, horizontal line = glide slope. Fly the flight path marker to the crosshair.'],
 aoai:['AoA index','Chevrons and a donut on the left. Donut alone means on-speed approach; upper chevron means fast, lower means slow.'],
 gear:['Gear and radar altitude','Landing gear status and height above the ground in feet.']
};

// shared pieces
function heading(y){let s='',i,x;
 s+=L(96,y,304,y);
 for(i=-3;i<=3;i++){x=200+i*30;s+=L(x,y,x,y-(i%2?6:10));}
 s+=T(140,y-14,'35','middle')+T(200,y-14,'36','middle')+T(260,y-14,'01','middle');
 s+=`<path d="M200 ${y+2}l-6 9h12z"/><rect x="176" y="${y+13}" width="48" height="20" rx="3"/>`+T(200,y+28,'360','middle');
 return G('hdg',s);}
function tapes(){
 return G('spd',`<path d="M78 130V270M78 130h-6M78 270h-6M78 150h-4M78 170h-4M78 190h-4M78 210h-4M78 230h-4M78 250h-4"/><rect x="14" y="190" width="54" height="22" rx="3"/>`+T(41,206,'350','middle'))
 +G('alt',`<path d="M322 130V270M322 130h6M322 270h6M322 150h4M322 170h4M322 190h4M322 210h4M322 230h4M322 250h4"/><rect x="332" y="190" width="56" height="22" rx="3"/>`+T(360,206,'12500','middle'));}
function ladder(){let s='';
 [[-60,10,0],[-30,5,0],[30,5,1],[60,10,1]].forEach(([d,n,dash])=>{const y=200+d,da=dash?' stroke-dasharray="4 3"':'';
  s+=`<path d="M150 ${y}H176M224 ${y}H250"${da}/>`+T(142,y+4,n,'end')+T(258,y+4,n);});
 s+=L(100,200,165,200)+L(235,200,300,200);
 return G('ladder',s);}
function fpm(){return G('fpm','<circle cx="200" cy="200" r="7"/><path d="M186 200h7M207 200h7M200 193v-7"/>');}
function aoa(){return G('aoa','<path d="M158 186h-7v28h7"/>');}
function mg(){return G('mg',T(20,290,'M.85')+T(20,305,'G 3.2'));}
function base(hy){return heading(hy)+tapes()+ladder()+fpm()+aoa()+mg();}
const wpTxt=()=>G('nav',T(20,340,'WP3 12.4')+T(20,355,'TTG 3:42'));
const lab=(t,y)=>T(200,y,t,'middle');
function store(a,b){return G('store',T(380,340,a,'end')+T(380,355,b,'end'));}
const rng=t=>G('rng',T(380,290,t,'end'));

const PLANES=[
 {id:'f18',name:'F/A-18C',sub:'Hornet',modes:[
  {id:'A/A',desc:'Air-to-air. The gun reticle, target box and missile data are shown.',
   draw:()=>base(46)+G('gun','<circle cx="200" cy="110" r="14"/><circle class="f" cx="200" cy="110" r="1.6"/><path d="M200 90v6M200 124v6M180 110h6M214 110h6"/>')
    +G('tgt','<rect x="277" y="92" width="26" height="26"/>'+T(290,138,'4.2','middle')+T(290,152,'+320','middle'))
    +G('cue','<path d="M135 102l8 8-8 8-8-8z"/>')+wpTxt()+rng('R 1200')+store('AIM-9','RDY 2')+lab('A/A',400)},
  {id:'ATTACK',desc:'Attack (air-to-ground). The bomb pipper, impact line and release cue are shown.',
   draw:()=>base(46)+G('pipper','<circle cx="200" cy="105" r="10"/><circle class="f" cx="200" cy="105" r="1.6"/>')
    +G('ccip','<path d="M200 120V190" stroke-dasharray="3 4"/>')
    +G('rel','<path d="M170 150h60"/>')
    +G('tgt','<path d="M262 92h-10v10M262 128h-10v-10M290 92h10v10M290 128h10v-10" transform="translate(-8 0)"/>'+T(284,146,'GS 420','middle'))
    +wpTxt()+rng('TTR 14')+store('MK-82','RDY 4')+lab('A/G',400)},
  {id:'NAV',desc:'Navigation. Waypoint, wind, ETA and fuel are shown.',
   draw:()=>base(46)+G('wp','<circle cx="250" cy="110" r="10"/><path d="M250 100v-6M250 120v6M240 110h-6M260 110h6"/>')
    +wpTxt()+G('wind',T(380,290,'WIND','end')+T(380,305,'270/15','end'))+G('fuel',T(380,340,'ETA 1432','end')+T(380,355,'FUEL 9.8','end'))+lab('NAV',400)}
 ]},
 {id:'f15',name:'F-15C',sub:'Eagle',modes:[
  {id:'NAV',desc:'Navigation. Steering cue to the active waypoint, TACAN data and fuel are shown.',
   draw:()=>base(368)+G('wp','<path d="M235 110l9 9-9 9-9-9z"/>')+wpTxt()
    +G('wind',T(380,290,'TACAN','end')+T(380,305,'084/22','end'))+G('fuel',T(380,340,'FUEL 11.2','end')+T(380,355,'ETA 1432','end'))+lab('NAV',26)},
  {id:'A/A',desc:'Air-to-air radar missile mode. Keep the dot inside the ASE circle and shoot inside the range scale.',
   draw:()=>base(368)+G('ase','<circle cx="200" cy="120" r="46"/><circle class="f" cx="212" cy="112" r="2"/>')
    +G('td','<rect x="228" y="96" width="22" height="22"/>'+T(239,134,'18.5','middle'))
    +G('rbar','<path d="M290 70V170M285 82h10M285 150h10"/><path class="f" d="M282 118l7-4v8z"/>'+T(298,86,'Rmax')+T(298,154,'Rmin'))
    +wpTxt()+rng('Vc +320')+store('AIM-120','RDY 4')+lab('A/A',26)},
  {id:'DGFT',desc:'Dogfight. Boresight gun cross and a missile scan circle for close-in fights.',
   draw:()=>base(368)+G('gun','<path d="M200 96v28M186 110h28"/><circle class="f" cx="200" cy="110" r="1.6"/>')
    +G('scan','<circle cx="200" cy="110" r="46" stroke-dasharray="5 4"/>')
    +wpTxt()+rng('GUN 510')+store('AIM-9','RDY 2')+lab('DGFT',26)},
  {id:'A/G',desc:'Air-to-ground. Bomb pipper, impact line and release cue are shown.',
   draw:()=>base(368)+G('pipper','<circle cx="200" cy="105" r="10"/><circle class="f" cx="200" cy="105" r="1.6"/>')
    +G('ccip','<path d="M200 120V190" stroke-dasharray="3 4"/>')+G('rel','<path d="M170 150h60"/>')
    +wpTxt()+rng('TTR 12')+store('MK-82','RDY 6')+lab('A/G',26)},
  {id:'LAND',desc:'Landing. ILS lines, AoA index and gear status are shown.',
   draw:()=>base(368)+G('ils','<path d="M208 90V310M110 194H290" stroke-dasharray="6 4"/>')
    +G('aoai','<circle cx="126" cy="200" r="5"/><path d="M118 180l8-6 8 6M118 220l8 6 8-6"/>')
    +wpTxt()+G('gear',T(380,290,'GEAR DN','end')+T(380,305,'RA 250','end'))+lab('LAND',26)}
 ]},
 {id:'f16',name:'F-16C',sub:'Viper',soon:1},
 {id:'f22',name:'F-22A',sub:'Raptor',soon:1},
 {id:'a10',name:'A-10C',sub:'Warthog',soon:1}
];

let cur=PLANES[0],mi=0;
const $=id=>document.getElementById(id),hud=$('hud');

function buildPlanes(){
 $('planes').innerHTML=PLANES.map(p=>`<button class="plane${p.soon?' soon':''}" data-id="${p.id}" role="tab">${jet}<b>${p.name}</b><small>${p.soon?'HUD coming soon':p.sub}</small></button>`).join('');
 $('planes').onclick=e=>{const b=e.target.closest('.plane');if(!b)return;
  const p=PLANES.find(x=>x.id===b.dataset.id);
  if(p.soon){card(p.name+' '+p.sub,'This HUD is not built yet. Tap the F/A-18C or F-15C to explore.');return;}
  cur=p;mi=0;render();};
}
function card(t,x){$('card').innerHTML=`<h2>${t}</h2><p>${x}</p>`;}
function render(){
 const m=cur.modes[mi],next=cur.modes[(mi+1)%cur.modes.length];
 document.querySelectorAll('.plane').forEach(b=>{b.classList.toggle('on',b.dataset.id===cur.id);b.setAttribute('aria-selected',b.dataset.id===cur.id);});
 hud.innerHTML=m.draw();
 hud.querySelectorAll('.t').forEach(g=>{const b=g.getBBox();
  g.insertAdjacentHTML('afterbegin',`<rect class="hit" rx="5" x="${b.x-8}" y="${b.y-8}" width="${b.width+16}" height="${b.height+16}"/>`);});
 $('mode').innerHTML=`<span>MODE</span><b>${m.id}</b><span>tap: ${next.id}</span>`;
 card(cur.name+' '+m.id+' mode',m.desc+' Tap any symbol to see what it does.');
}
hud.onclick=e=>{const g=e.target.closest('.t');if(!g)return;
 hud.querySelectorAll('.sel').forEach(n=>n.classList.remove('sel'));g.classList.add('sel');
 const i=INFO[g.dataset.k];card(i[0],i[1]);};
$('mode').onclick=()=>{mi=(mi+1)%cur.modes.length;render();};
buildPlanes();render();
</script>
</body>
</html>
